# Standalone alternative to docker-compose.yml; one dashboard process only.
services:
  wh-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wh_dashboard
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/video0:/dev/video0
      - /dev/video2:/dev/video2
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python", "PyScripts/Camera_mit_Rotation_dashboard.py"]
