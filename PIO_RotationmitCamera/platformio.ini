; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 设置串口监视器波特率为 115200
monitor_speed = 115200

lib_deps = madhephaestus/ESP32Servo

; Normal car firmware excludes the standalone steering test entry point.
build_src_filter = +<*> -<servo_demo.cpp>

[env:servo_demo]
extends = env:esp32dev
; Build ONLY the test: no RC takeover, encoder, or line-sensor control loop.
build_src_filter = -<*> +<servo_demo.cpp> +<steering_control.cpp>
