<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MPS4264 CSV 压力—时间图</title>
  <link rel="stylesheet" href="{{ url_for('pressure_plot.static', filename='pressure_plot.css') }}">
  <script src="{{ url_for('pressure_plot.static', filename='pressure_plot.js', v='20261007-dash-cycle') }}" defer></script>
</head>
<body>
<main id="pressure-plot" data-initial="{{ 'true' if initial_csv else 'false' }}">
  <header><h1>CSV 压力—时间图</h1><a href="/">返回首页</a></header>
  <section class="load-controls" aria-label="选择 CSV">
    <label>从电脑上传 CSV<input type="file" id="csv-upload" accept=".csv"></label>
    <label>服务端数据目录<select id="csv-files"><option value="">选择 CSV 文件</option></select></label>
    <button type="button" id="refresh-files">刷新文件列表</button>
    <button type="button" id="load-file">读取所选文件</button>
  </section>
  <p id="plot-message" role="status" aria-live="polite">支持 ScanTel 和 Linux 版 CSV；上传内容不会保存到服务器。</p>
  <section class="plot-controls" aria-label="绘图设置">
    <label>开始时间（s）<input id="time-start" type="number" step="any"></label>
    <label>结束时间（s）<input id="time-end" type="number" step="any"></label>
    <button type="button" id="apply-range">应用时间范围</button>
    <button type="button" id="reset-range">完整时间范围</button>
    <button type="button" id="save-image">保存 PNG</button>
  </section>
  <div class="chart-shell"><canvas id="csv-pressure-chart" aria-label="所选通道的压力—时间曲线">浏览器需要支持 Canvas。</canvas><div id="plot-tooltip" hidden></div></div>
  <p class="note">曲线显示按屏幕分辨率保留极值；指针读数使用原始帧。空值、非有限值和 -999999 不绘制，也不跨越缺帧连线。</p>
  <div class="channel-actions"><span id="selection-count" aria-live="polite">未加载文件</span><button id="select-all" type="button">全选有效通道</button><button id="select-none" type="button">取消全部</button></div>
  <div id="csv-channels" class="channels" aria-label="选择压力通道"></div>
  <p class="note">横轴使用 CSV 中的设备帧时间，不等同于主机 UTC；压力数值已是对应单位，不再乘转换系数。</p>
</main>
</body>
</html>
